<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>장소별 보기 데모</title>
<style>body{margin:0;padding:12px 16px;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;background:#fff}</style></head>
<body>
<p style="font-size:.8rem;color:#b71c1c">⚠️ 데모: 아래 값은 시연용 가짜 셀이에요(엔진 결과 아님). 실행: python3 scripts/dev-server.py → http://localhost:8787/validation/place_view_demo.html</p>
<div id="place-view"></div>
<script type="module">
import { buildPlaceTimeline } from "../engine/place_view.js";
import { renderPlaceTimeline } from "../app/place_view_ui.js";
const t = (d, h) => `2026-11-${d}T${String(h).padStart(2, "0")}:00:00+09:00`;
const L = (level) => ({ value: 1, level, flags: [] });
const calm = { value: null, level: null, flags: ["약풍미표시"] };
const near = { value: 0.3, level: "강", flags: ["근거리불확실"], 하한값: 0.06, 하한등급: "강" };
const below = { value: 0.0005, level: null, flags: [] };
const seq = [[17,null,null],[18,L("약"),null],[19,L("중"),L("중")],[20,L("중"),near],[21,L("약"),L("강")],[22,below,calm],[23,null,calm]];
const series = seq.map(([h,n,e]) => ({ hour: t(26,h), cellsByPlace: { 올림픽수영장: { noise: n, exhaust: e } } }));
series.push({ hour: t(27,0), cellsByPlace: { 올림픽수영장: { noise: null, exhaust: below } } });
const el = document.getElementById("place-view");
renderPlaceTimeline(el, buildPlaceTimeline({ series, placeName: "올림픽수영장" }), { onClose: () => (el.hidden = true) });
</script></body></html>
